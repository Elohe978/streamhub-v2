
name: Prepare StreamHub Backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract backend
        run: |
          mkdir -p /tmp/streamhub-extract
          unzip -q streamhub_source_bundle.zip -d /tmp/streamhub-extract

          BACKEND_DIR=$(find /tmp/streamhub-extract \
            -type d -name backend -print -quit)

          if [ -z "$BACKEND_DIR" ]; then
            echo "Backend folder not found in archive"
            exit 1
          fi

          cp -a "$BACKEND_DIR" ./backend

      - name: Show backend files
        run: find backend -maxdepth 3 -type f

      - name: Save backend to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "Extract StreamHub backend"
            git push
          else
            echo "Backend files already exist"
          fi
          
